plugins { id 'com.android.application' }
android {
    if (System.getenv('HYDRO_DEBUG_KEYSTORE')) {
        signingConfigs {
            debug {
                storeFile file(System.getenv('HYDRO_DEBUG_KEYSTORE'))
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    namespace 'com.hydrodaily.app'
    compileSdk 35
    defaultConfig { applicationId 'com.hydrodaily.app'; minSdk 26; targetSdk 35; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
