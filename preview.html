<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水日常 · 应用功能预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9eff8;font-family:system-ui,'Microsoft Yahei',sans-serif;color:#19334b}main{width:410px;max-width:100%;margin:30px auto;background:#f8fbff;min-height:850px;border-radius:34px;padding:28px;box-shadow:0 25px 80px #19334b20}header{display:flex;justify-content:space-between;align-items:center}small{color:#71859a;font-size:12px}h1{font-size:26px;letter-spacing:-1px}h2{font-size:21px}nav{display:flex;gap:6px;margin:20px 0}button{border:0;border-radius:14px;background:#e6eefb;color:#245fb0;padding:14px;cursor:pointer;font-size:14px}nav button{flex:1;padding:12px 2px;font-size:12px}nav .active,.primary{background:#2165da;color:white}.hero{border-radius:26px;background:linear-gradient(135deg,#2165da,#48afc4);color:white;padding:30px 24px;text-align:center}.hero small{color:#d5eaff}.ring{height:190px;width:190px;border-radius:50%;margin:20px auto;background:conic-gradient(#ffffff var(--p),#ffffff30 0);padding:9px}.inner{height:100%;border-radius:50%;background:#338bcf;display:flex;flex-direction:column;justify-content:center}.amount{font-size:38px;font-weight:700}.card{padding:20px;background:white;border-radius:20px;margin:16px 0;border:1px solid #e9eef5}.row{display:flex;gap:8px}.row button{flex:1}.muted{font-size:13px;color:#728398;line-height:1.7}.entry{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf1f7}label{display:block;font-size:14px;margin:18px 0 8px}input{font:inherit;padding:13px;border-radius:10px;border:1px solid #d6e1ee;width:100%;background:#f9fbff}input[type=checkbox]{width:auto}.primary{width:100%;margin-top:18px}.badge{background:#e5f7f2;color:#23866f;padding:6px 10px;border-radius:20px;font-size:11px}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#19334b;color:white;padding:14px 22px;border-radius:12px;z-index:10}a{color:#2165da}@media(max-width:500px){main{margin:0;border-radius:0;min-height:100vh}}</style>
<main><header><div><small>HYDRO DAILY</small><h1>水日常<span style="color:#2165da"> ◕</span></h1></div><span class="badge">交互预览</span></header><nav id="nav"></nav><section id="content"></section><p class="muted">浏览器预览 · 数据保存在当前浏览器。<br>安卓版本使用系统通知；这里的提醒仅作演示。</p></main><div id="toast" hidden class="toast"></div>
<script>
const $=id=>document.getElementById(id);const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
let db;try{db=JSON.parse(localStorage.getItem('hydro-preview-v1'))}catch{}db=db||{weight:60,activity:0,hot:false,manual:0,dataDay:'',logs:{},goals:{},enabled:false,start:8,end:22,interval:60};let tab=0,timer;
function save(){try{localStorage.setItem('hydro-preview-v1',JSON.stringify(db))}catch{toast('浏览器未允许持久保存，本次记录仅在当前页面有效')}}
function goal(){return db.manual||Math.min(3500,Math.max(1200,Math.round((db.weight*30+(db.dataDay===today()?db.activity*5+(db.hot?250:0):0))/50)*50))}
function logs(){return db.logs[today()]||[]}function total(){return logs().reduce((n,e)=>n+e.ml,0)}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2600)}
function add(ml){if(!Number.isInteger(ml)||ml<1||ml>1000){toast('请输入1–1000之间的整数');return}db.logs[today()]=[...logs(),{ml,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}];db.goals[today()]=goal();save();render();toast(`已记录 ${ml} ml`)}
function custom(){let n=prompt('输入杯量（1–1000 ml）');if(n!==null)add(Number(n))}
function undo(){if(!logs().length){toast('还没有可撤销的记录');return}db.logs[today()].pop();save();render();toast('已撤销最近一笔')}
function render(){let names=['今日饮水','身体数据','提醒设置','最近七天'];$('nav').innerHTML=names.map((n,i)=>`<button class="${i===tab?'active':''}" onclick="tab=${i};render()">${n}</button>`).join('');let html='';
if(tab===0){let n=total(),g=goal();html=`<p class="muted">${today()} · 每一口，都算数</p><div class="hero"><small>今天，你照顾自己了吗？</small><div class="ring" style="--p:${Math.min(n/g*100,100)}%"><div class="inner"><span class="amount">${n}</span><small>ml / ${g} ml</small></div></div><div>${n>=g?'目标已完成，后续按需饮用':'距离目标还有 '+(g-n)+' ml'}</div></div><div class="card"><h2>记录一杯水</h2><div class="row">${[150,250,350].map(v=>`<button onclick="add(${v})">＋${v}<br><small>ml</small></button>`).join('')}</div><button class="primary" onclick="custom()">自定义杯量</button></div><div class="card"><div class="entry"><b>今日记录</b><a href="#" onclick="event.preventDefault();undo()">撤销最近一笔</a></div>${logs().length?logs().slice().reverse().map(e=>`<div class="entry"><span>${e.time}</span><b>＋${e.ml} ml</b></div>`).join(''):'<p class="muted">还没有记录，从第一杯开始。</p>'}</div><p class="muted">目标仅为可调整的粗略估算。茶、奶等饮品也可记录，无需一次补足差额。</p>`}
if(tab===1){html=`<h2>了解今天的你</h2><p class="muted">体重长期保存；运动和炎热状态仅对当天生效。</p><form id="profile" class="card"><label>体重 · kg</label><input id="weight" type="number" min="30" max="250" step="0.1" value="${db.weight}" required><label>今日运动 · 分钟</label><input id="activity" type="number" min="0" max="240" value="${db.dataDay===today()?db.activity:0}" required><label><input id="hot" type="checkbox" ${db.dataDay===today()&&db.hot?'checked':''}> 今天处于炎热环境</label><label>手动目标 · ml（0 表示自动估算）</label><input id="manual" type="number" min="0" max="5000" value="${db.manual}" required><button class="primary">保存今日数据</button></form><p class="muted">自动规则：体重×30 + 运动分钟×5 + 炎热时250 ml，取50的倍数，范围1200–3500 ml。该产品规则未经过临床验证。</p><p class="muted">适用于一般成年人的记录用途。儿童、孕哺期，以及有心肾疾病或限水医嘱者，请按专业建议设置手动目标。</p>`}
if(tab===2){html=`<h2>把喝水放进日常</h2><form id="reminders" class="card"><label><input id="enabled" type="checkbox" ${db.enabled?'checked':''}> 开启饮水提醒</label><label>开始时间 · 小时（0–23）</label><input id="start" type="number" min="0" max="23" value="${db.start}" required><label>结束时间 · 小时（1–24）</label><input id="end" type="number" min="1" max="24" value="${db.end}" required><label>间隔 · 分钟（30–180）</label><input id="interval" type="number" min="30" max="180" value="${db.interval}" required><button class="primary">保存提醒设置</button></form><button onclick="demo()" style="width:100%">体验一次提醒</button><p class="muted">预览不发送后台通知。安卓端会在作息时段内提醒，目标完成后当天停止；系统省电策略可能推迟通知。</p><div id="notification"></div>`}
if(tab===3){html='<h2>最近七天</h2><div class="card">';for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);let date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,n=(db.logs[date]||[]).reduce((a,e)=>a+e.ml,0);html+=`<div class="entry"><span>${date}</span><b>${n} ml</b></div>`}html+='</div><p class="muted">安卓端数据仅保存在本机，卸载应用会清除记录。</p>'}
$('content').innerHTML=html;
if(tab===1)$('profile').onsubmit=e=>{e.preventDefault();let w=Number($('weight').value),a=Number($('activity').value),m=Number($('manual').value);if(!Number.isFinite(w)||w<30||w>250||!Number.isInteger(a)||a<0||a>240||!Number.isInteger(m)||(m!==0&&(m<500||m>5000))){toast('请检查输入范围，手动目标为500–5000或0');return}Object.assign(db,{weight:w,activity:a,manual:m,hot:$('hot').checked,dataDay:today()});db.goals[today()]=goal();save();tab=0;render();toast('今日数据已更新')};
if(tab===2)$('reminders').onsubmit=e=>{e.preventDefault();let a=Number($('start').value),b=Number($('end').value),n=Number($('interval').value);if(![a,b,n].every(Number.isInteger)||a<0||a>23||b<=a||b>24||n<30||n>180){toast('请检查时间与间隔范围');return}Object.assign(db,{enabled:$('enabled').checked,start:a,end:b,interval:n});save();toast('提醒设置已保存（预览模式）')};}
function demo(){let hour=new Date().getHours();let msg=!db.enabled?'提醒已关闭，开启并保存后可体验':total()>=goal()?'今日目标已完成，今天不再提醒':hour<db.start||hour>=db.end?'当前处于免打扰时段，下一作息时段再提醒':`休息一下，喝点水。今天已记录 ${total()} ml，目标 ${goal()} ml。按需小口饮用。`;$('notification').innerHTML='<div class="card"><b>水日常 · 提醒演示</b><p>'+msg+'</p></div>'}render();
</script></html>
